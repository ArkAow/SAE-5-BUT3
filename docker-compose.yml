version: '3.8'

services:
  frontend:
    image: node:22.9
    container_name: frontend_container
    working_dir: /app
    ports:
      - "8700:3000"
    volumes:
      - ./app:/app
    command: sh -c "npm i && npm start -- --port 8700"
    networks:
      - app_network
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_container
    working_dir: /backend
    ports:
      - "8600:8600"
    volumes:
      - ./backend:/backend
    command: sh -c "composer install && php -S 0.0.0.0:8600 -t public"
    networks:
      - app_network
    restart: always

networks:
  app_network:
    driver: bridge
