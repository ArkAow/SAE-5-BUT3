services:
  frontend:
    build:
      context: ./app
      dockerfile: .docker/Dockerfile
    container_name: frontend_container
    working_dir: /app
    ports:
      - "8700:3000"
    volumes:
      - ./app:/appl
    command: sh -c "npm install && npm run electron-start"
    networks:
      - sae_previsionnel
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: .docker/Dockerfile
    container_name: backend_container
    working_dir: /app
    ports:
      - "8600:8600"
    volumes:
      - ./backend:/app
    command: sh -c "composer install && php -S 0.0.0.0:8600 -t public"
    networks:
      - sae_previsionnel
    restart: always

networks:
  sae_previsionnel:
    driver: bridge
